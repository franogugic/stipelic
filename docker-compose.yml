services:
  postgres:
    image: postgres:16
    container_name: creator_platform_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: creator_platform
      POSTGRES_USER: creator_platform
      POSTGRES_PASSWORD: creator_platform_dev
    ports:
      - "5433:5432"
    volumes:
      - creator_platform_postgres_data:/var/lib/postgresql/data

  # A cache and rate-limit store: nothing in it needs to survive a restart, so no volume and no persistence.
  # Host port 6380, not 6379, so a locally installed Redis (e.g. Homebrew on 127.0.0.1:6379) can never take its place.
  redis:
    image: redis:7.4-alpine
    container_name: creator_platform_redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6380:6379"

  # Development email catcher: the API and the Worker send to its SMTP (host port 1025) by default in Development, and every
  # message shows up in the web UI at http://localhost:8025 instead of going out. Kept in memory: nothing survives a restart.
  mailpit:
    image: axllent/mailpit:v1.31.6
    container_name: creator_platform_mailpit
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  creator_platform_postgres_data:

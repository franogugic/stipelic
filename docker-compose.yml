services:
  postgres:
    image: postgres:16
    container_name: creator_platform_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: creator_platform
      POSTGRES_USER: creator_platform
      POSTGRES_PASSWORD: creator_platform_dev
    ports:
      - "5433:5432"
    volumes:
      - creator_platform_postgres_data:/var/lib/postgresql/data

  # A cache and rate-limit store: nothing in it needs to survive a restart, so no volume and no persistence.
  redis:
    image: redis:7.4-alpine
    container_name: creator_platform_redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"

volumes:
  creator_platform_postgres_data:
